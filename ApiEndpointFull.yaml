swagger: '2.0'
info:
    title: Bank Argent API documentation
    description: Contains all available API endpoints in this codebase
    version: '1.0.0'
    termsOfService: 'http://swagger.io/terms/'
host: localhost:3001
basePath: /api/v1
schemes:
    - http
paths:
    /user/login:
        post:
            tags:
                - User Module
            summary: Login
            description: API for Login
            parameters:
                - in: body
                  name: body
                  description: Login Payload
                  required: true
                  schema:
                      $ref: '#/definitions/Login'
            produces:
                - application/json
            responses:
                '200':
                    description: Login Successfully
                    schema:
                        $ref: '#/definitions/LoginResponse'
                '400':
                    description: Invalid Fields
                '500':
                    description: Internal Server Error
    /user/signup:
        post:
            tags:
                - User Module
            summary: Signup
            description: API for Signup
            parameters:
                - in: body
                  name: body
                  description: Signup Payload
                  required: true
                  schema:
                      $ref: '#/definitions/User'
            produces:
                - application/json
            responses:
                '200':
                    description: Signup Successfully
                    schema:
                        $ref: '#/definitions/ApiResponse'
                '400':
                    description: Invalid Fields
                '500':
                    description: Internal Server Error
    /user/profile:
        post:
            security:
                - Bearer: []
            tags:
                - User Module
            summary: User Profile API
            description: API for fetching a user profile
            parameters:
                - in: header
                  name: Authorization
                  description: Attach Bearer JWT token
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                '200':
                    description: User profile retrieved successully
                    schema:
                        $ref: '#/definitions/ApiResponse'
                '400':
                    description: Invalid Fields
                '500':
                    description: Internal Server Error
        put:
            security:
                - Bearer: []
            tags:
                - User Module
            summary: User Profile API
            description: API for updating a user profile
            parameters:
                - in: header
                  name: Authorization
                  description: Attach Bearer JWT token
                  required: true
                  type: string
                - in: body
                  name: body
                  description: Update user profile attributes
                  required: true
                  schema:
                      $ref: '#/definitions/UserProfile'
            produces:
                - application/json
            responses:
                '200':
                    description: User profile retrieved successully
                    schema:
                        $ref: '#/definitions/ApiResponse'
                '400':
                    description: Invalid Fields
                '500':
                    description: Internal Server Error

    /transactions:
        get:
            security:
                - Bearer: []
            tags:
                - Transactions
            summary: Transactions
            description: Recover all transaction of a user grouped by account
            operationId: getTransactions
            parameters:
                - name: Authorization
                  in: header
                  description: Attach Bearer JWT token
                  required: true
                  type: string
            produces:
                - application/json
            responses:
                '200':
                    description: Successful operation
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/transactions'
                '401':
                    description: Unauthorized
                '404':
                    description: Not found
                '500':
                    description: Internal server error

    /transactions/{id}:
        get:
            security:
                - Bearer: []
            tags:
                - Transactions
            summary: Transaction infomations
            description: Retrieve all informations of a transaction
            operationId: getTransactionInfo
            parameters:
                - name: Authorization
                  in: header
                  description: Attach Bearer JWT token
                  required: true
                  type: string

                - name: id
                  in: path
                  description: ID of a transaction
                  type: string
                  required: true
            produces:
                - application/json
            responses:
                '200':
                    description: Successful operation
                    schema:
                        $ref: '#/definitions/transactionDetails'
                '400':
                    description: Invalid ID supplied
                '401':
                    description: Unauthorized
                '404':
                    description: Not found
                '500':
                    description: Internal server error

        put:
            security:
                - Bearer: []
            tags:
                - Transactions
            summary: Transaction's information modification
            description: Add or modify the category or note of a transaction, based on the query parameter.
            operationId: modifyTransaction
            parameters:
                - name: id
                  in: path
                  required: true
                  description: ID of the transaction to updated
                  type: string
                - name: Authorization
                  in: header
                  required: true
                  description: Bearer JWT token
                  type: string
                - name: modify
                  in: query
                  required: true
                  description: Specify whether to modify 'category' or 'note'
                  type: string
                - name: body
                  in: body
                  required: true
                  description: Depending on the query parameter, either the category or note will be updated.
                  schema:
                      $ref: '#/definitions/UpdateBody'
            produces:
                - application/json
            responses:
                '200':
                    description: Transaction updated successfully
                    schema:
                        $ref: '#/definitions/UpdateResponse'
                '400':
                    description: Invalid input or ID
                '401':
                    description: Unauthorized
                '404':
                    description: Not found
                '500':
                    description: Internal server error

securityDefinitions:
    Bearer:
        type: apiKey
        name: Authorization
        in: header
definitions:
    User:
        properties:
            email:
                type: string
                description: user email
            password:
                type: string
                description: user password
            firstName:
                type: string
                description: user first name
            lastName:
                type: string
                description: user last name
    Login:
        properties:
            email:
                type: string
                description: user email
            password:
                type: string
                description: user password
    ApiResponse:
        type: object
        properties:
            status:
                type: integer
            message:
                type: string
            body:
                type: object
                properties:
                    id:
                        type: string
                    email:
                        type: string
    LoginResponse:
        type: object
        properties:
            token:
                type: string
    UserProfile:
        type: object
        properties:
            firstName:
                type: string
            lastName:
                type: string
    transactions:
        type: object
        properties:
            accountId:
                type: string
                example: '1'
            accountBalance:
                type: string
                example: '2082.79'
            accountName:
                type: string
                example: Argent Bank Checking (x8349)
            transactions:
                type: array
                items:
                    $ref: '#/definitions/transactionInfo'
    transactionInfo:
        type: object
        properties:
            id:
                type: string
                example: '1'
            date:
                type: string
                example: '10/10/2024'
            description:
                type: string
                example: Golden Sun Bakery
            amount:
                type: string
                example: '50.00'
            balance:
                type: string
                example: '2187.79'
    transactionDetails:
        type: object
        properties:
            id:
                type: string
                example: '1'
            date:
                type: string
                example: '10/10/2024'
            description:
                type: string
                example: Golden Sun Bakery
            amount:
                type: string
                example: '50.00'
            balance:
                type: string
                example: '2187.79'
            type:
                type: string
                example: Electronic
            category:
                type: string
                example: Food
            note:
                type: string
                example: For me and friends
    UpdateResponse:
        type: object
        properties:
            status:
                type: integer
                format: int32
            message:
                type: string
        xml:
            name: '##default'
    UpdateBody:
        type: object
        properties:
            category:
                type: string
                example: 'Food'
            note:
                type: string
                example: 'This is a note for the transaction.'
